name: Deploy Angular App to GitHub Pages

on:
  push:
    branches: [ master ] # Change to 'master' if your main branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Stable LTS version

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build -- --configuration production --base-href "/video-player/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/video-player